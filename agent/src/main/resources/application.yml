spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  ai:
    google:
      genai:
        api-key: ${MODEL_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite-preview
            temperature: 0.2

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, env

atracio:
  base-url: ${ATRACIO_BASE_URL:https://demo.prod.atracio.com}