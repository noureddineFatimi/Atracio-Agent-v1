spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: qwen2.5:1.5b
          temperature: 0.2

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, env

atracio:
  base-url: ${ATRACIO_BASE_URL:https://demo.prod.atracio.com}